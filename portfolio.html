</footer>

  <!-- PORTFOLIO FILTERING & REVEAL JAVASCRIPT -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // 1. Mobile Menu Toggle Logic
      const hamburger = document.getElementById('hamburger');
      const mobileMenu = document.getElementById('mobileMenu');
      if (hamburger && mobileMenu) {
        hamburger.addEventListener('click', () => {
          mobileMenu.classList.toggle('active');
        });
      }

      // 2. Dynamic Portfolio Filter Logic
      const filterButtons = document.querySelectorAll('.filter-btn');
      const portfolioCards = document.querySelectorAll('.portfolio-card');

      filterButtons.forEach(button => {
        button.addEventListener('click', () => {
          // Remove active class from all filter buttons
          filterButtons.forEach(btn => btn.classList.remove('active'));
          // Add active class to clicked button
          button.classList.add('active');

          const filterValue = button.getAttribute('data-filter');

          portfolioCards.forEach(card => {
            const cardCategory = card.getAttribute('data-cat');
            
            // Check if card matches filter or if 'All' is selected
            if (filterValue === 'all' || filterValue === cardCategory) {
              // Show card with a smooth fade/scale transition
              card.style.display = 'block';
              setTimeout(() => {
                card.style.opacity = '1';
                card.style.transform = 'translateY(0) scale(1)';
              }, 50);
            } else {
              // Hide card smoothly
              card.style.opacity = '0';
              card.style.transform = 'translateY(20px) scale(0.95)';
              setTimeout(() => {
                card.style.display = 'none';
              }, 300); // Matches standard CSS animation time
            }
          });
        });
      });

      // 3. Scroll Reveal Animation Logic
      const reveals = document.querySelectorAll('.reveal');
      
      const revealOnScroll = () => {
        const windowHeight = window.innerHeight;
        const elementVisible = 120; // Trigger slightly before the element enters full view
        
        reveals.forEach(el => {
          // If the element is currently hidden via filtering, don't force reveal it
          if (el.style.display === 'none') return;

          const elementTop = el.getBoundingClientRect().top;
          if (elementTop < windowHeight - elementVisible) {
            el.style.opacity = "1";
            el.style.transform = "translateY(0)";
          }
        });
      };

      // Set initial base transition styles dynamically for elements with .reveal
      reveals.forEach(el => {
        el.style.opacity = "0";
        el.style.transform = "translateY(30px)";
        el.style.transition = "opacity 0.5s ease-out, transform 0.5s ease-out";
      });

      // Fire scroll listeners
      window.addEventListener('scroll', revealOnScroll);
      window.addEventListener('load', revealOnScroll);
      // Run once on load to catch elements already in viewport
      revealOnScroll();
    });
  </script>

  <!-- External App Scripts -->
  <script src="main.js"></script>
  <script src="chatbot.js"></script>
  <script src="exit-popup.js"></script>
</body>
